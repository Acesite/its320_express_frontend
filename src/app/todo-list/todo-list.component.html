<div class="h-dvh grid place-items-center bg-gray-100 p-6">
  <div class="space-y-6 w-full max-w-md">

    <!-- Form Card -->
    <form method="post" class="flex flex-col gap-4 shadow-2xl px-8 py-6 border border-gray-200 bg-white rounded-2xl">
      <label for="todoitem" class="text-2xl font-semibold text-gray-800">Add To-Do Item</label>

      <input
        [formControl]="item"
        type="text"
        name="todoitem"
        class="border border-gray-300 rounded-lg px-4 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Enter your task here..."
      />

      <button
        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-200 font-medium"
        type="button"
        (click)="pushToList()"
      >
        {{ editMode ? 'Update Task' : 'Add Task' }}
      </button>
    </form>

    <!-- Task List -->
    <div class="bg-white shadow-xl rounded-2xl border border-gray-200 overflow-auto max-h-64 p-4">
      <p class="text-xl font-semibold text-gray-800 mb-3">Task List</p>

      <ol class="space-y-2">
        @for (todo of list; track todo._id) {
          <li key={todo._id} class="flex justify-between items-center border-b border-gray-100 pb-2 last:border-none text-gray-700">
            <span class="truncate max-w-[65%]">{{ todo.task }}</span>
            <div class="space-x-3 flex items-center">
              <!-- Edit Icon -->
              <button (click)="editTodo(todo)" class="text-blue-600 hover:text-blue-800" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3-6 6H9v-3z" />
                </svg>
              </button>
              <!-- Delete Icon -->
              <!-- Delete Icon -->
<button (click)="deleteTodo(todo._id!)" class="text-red-500 hover:text-red-700" title="Delete">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
    stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3m-7 0h8" />
  </svg>
</button>

            </div>
          </li>
        }
      </ol>
    </div>

  </div>
</div>
