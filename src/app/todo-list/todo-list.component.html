<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="flex flex-col lg:flex-row gap-6 max-w-6xl w-full">
    <!-- Form Section -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 w-full lg:w-80 h-[300px]">     
      <h2 class="text-xl font-medium text-gray-800 mb-5">Add Task</h2>
      
      <form class="flex flex-col gap-4">
        <input 
          [formControl]="item" 
          type="text" 
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition" 
          placeholder="Enter task...">
          
        <select 
          [formControl]="day" 
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition appearance-none bg-no-repeat bg-right">
          <option value="" disabled selected>Select day</option>
          <option *ngFor="let d of days" [value]="d">{{ d }}{{ isToday(d) ? ' (Today)' : '' }}</option>
        </select>
        
        <button 
          type="button"
          (click)="pushToList()" 
          class="mt-2 w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
          {{ editMode ? 'Update' : 'Add Task' }}
        </button>
      </form>
    </div>
    
    <!-- Task List Section -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex-1">
      <h2 class="text-xl font-medium text-gray-800 mb-5">My Tasks</h2>
      
      <!-- Day Pagination Controls -->
      <div class="flex items-center justify-between mb-6">
        <button 
          (click)="prevDayPage()" 
          [disabled]="currentDayPage === 1"
          [class.opacity-50]="currentDayPage === 1"
          class="flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>
        
        <div class="text-sm text-gray-600">
          Page {{ currentDayPage }} of {{ getTotalDayPages() }}
        </div>
        
        <button 
          (click)="nextDayPage()" 
          [disabled]="currentDayPage === getTotalDayPages()"
          [class.opacity-50]="currentDayPage === getTotalDayPages()"
          class="flex items-center justify-center w-8 h-8 rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>
      
      <!-- Go to Today Button -->
      <div class="mb-4 flex justify-center">
        <button 
          (click)="showTodayPage()" 
          class="text-sm px-4 py-2 bg-blue-50 text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-100 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 inline-block mr-1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
          </svg>
          Go to Today
        </button>
      </div>
      
      <div class="space-y-6">
        <!-- Only show days from the current page -->
        <div *ngFor="let day of getVisibleDays()">
          <div *ngIf="hasTasks(day)" class="mb-6">
            <!-- Show day with "Today" indicator if it matches today -->
            <h3 class="text-base font-medium mb-3" [class.text-blue-600]="isToday(day)" [class.text-gray-600]="!isToday(day)">
              {{ day }}
              <span *ngIf="isToday(day)" class="ml-2 text-xs font-medium px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full">TODAY</span>
            </h3>
            
            <div class="space-y-2">
              <!-- Show only paginated tasks -->
              <div *ngFor="let todo of getPaginatedTodos(day); trackBy: trackById" 
                class="flex items-center justify-between py-3 px-4 rounded-lg hover:bg-gray-100 transition group"
                [class.bg-blue-50]="isToday(day)"
                [class.bg-gray-50]="!isToday(day)">
                <div class="flex-1">
                  <p class="font-medium text-gray-800">{{ todo.task }}</p>
                  <p class="text-xs text-gray-500 mt-0.5">{{ todo.day }}</p>
                </div>
                
                <div class="flex space-x-2">
                  <button 
                    (click)="editTodo(todo)" 
                    class="p-1.5 text-gray-500 hover:text-blue-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                    </svg>
                  </button>
                  
                  <button 
                    (click)="deleteTodo(todo._id)" 
                    class="p-1.5 text-gray-500 hover:text-red-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                    </svg>
                  </button>
                </div>
              </div>
              
              <!-- Pagination Controls for Tasks -->
              <div *ngIf="getTotalPages(day) > 1" class="flex items-center justify-center space-x-2 mt-4">
                <div class="flex items-center space-x-1">
                  <button 
                    *ngFor="let page of [].constructor(getTotalPages(day)); let i = index" 
                    (click)="goToPage(day, i + 1)"
                    [class.bg-blue-100]="currentPage[day] === i + 1"
                    [class.text-blue-600]="currentPage[day] === i + 1"
                    [class.border-blue-300]="currentPage[day] === i + 1"
                    class="w-8 h-8 rounded-md border border-gray-200 flex items-center justify-center text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
                    {{ i + 1 }}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Empty state when no tasks in visible days -->
        <div *ngIf="hasNoVisibleTasks()" class="text-center py-10">
          <p class="text-gray-500">No tasks for these days</p>
        </div>
      </div>
    </div>
  </div>
</div>
